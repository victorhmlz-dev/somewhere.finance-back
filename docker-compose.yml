services:
  postgres:
    image: postgres:17-alpine
    container_name: somewhere-finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-somewhere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-somewhere}
      POSTGRES_DB: ${POSTGRES_DB:-somewhere_finance}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
